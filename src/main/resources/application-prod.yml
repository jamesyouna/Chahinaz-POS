server:
  address: ${POS_BIND_ADDRESS:127.0.0.1}
  port: ${POS_APP_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${POS_SECURE_COOKIE:false}
pos:
  public-catalogue:
    allowed-origins: ${POS_PUBLIC_CATALOGUE_ORIGINS:https://chahinazdollar.store,https://www.chahinazdollar.store}
logging:
  file:
    name: ${POS_LOG_FILE:./logs/chahinaz-pos.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB
  level:
    root: INFO
    org.springframework.security: WARN
