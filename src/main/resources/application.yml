spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:postgresql://${POS_DB_HOST:localhost}:${POS_DB_PORT:5432}/${POS_DB_NAME:chahinaz_pos}
    username: ${POS_DB_USER:chahinaz}
    password: ${POS_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${POS_SECURE_COOKIE:false}
      timeout: 8h
pos:
  images:
    directory: ${POS_IMAGE_DIR:./data/product-images}
